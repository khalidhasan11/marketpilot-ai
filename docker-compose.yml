services:
  backend:
    build: .
    ports: ["8000:8000"]
    environment:
      - MARKETPILOT_DB=/data/marketpilot.db
    volumes: ["mpdata:/data"]
    restart: unless-stopped
  # Optional production profile: Postgres+TimescaleDB and Redis (not required locally)
  # postgres: { image: timescale/timescaledb:latest-pg16, profiles: ["prod"], environment: {POSTGRES_PASSWORD: "change-me"}, volumes: ["pgdata:/var/lib/postgresql/data"] }
  # redis: { image: redis:7-alpine, profiles: ["prod"] }
volumes: { mpdata: {}, pgdata: {} }
