<!DOCTYPE html><html><head><meta charset="utf-8"><title>MarketPilot AI — Options</title>
<style>body{background:#0b0f17;color:#e8eef8;font-family:system-ui;padding:20px;max-width:520px}input{background:#0a0f1a;color:#e8eef8;border:1px solid #22304a;border-radius:8px;padding:7px}button{background:#38bdf8;border:0;border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer}.dim{color:#8fa3c0;font-size:12.5px}</style></head><body>
<h1>MarketPilot AI — Options</h1>
<label>Backend API base (optional) <input id="apiBase" size="36" placeholder="e.g. http://localhost:8000"></label>
<label style="display:block;margin:12px 0"><input type="checkbox" id="notify"> Notify on strong BTC score (every 15 min check)</label>
<button id="save">Save</button> <span id="msg"></span>
<p class="dim">No API keys are stored in this extension. Market data comes from the Binance public API. The extension never interacts with Quotex or any trading site.</p>
<script src="options.js"></script></body></html>
